<svg xmlns="http://www.w3.org/2000/svg" width="360" height="108" viewBox="0 0 360 108" role="img" aria-label="Vancouver: light drizzle, plus 10 degrees Celsius">
  <rect width="360" height="108" fill="#000000"/>
  <text x="16" y="21" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="1.5" fill="#8b949e">vancouver</text>
  <g font-family="'Courier New',Courier,monospace" font-size="13" fill="#e6edf3">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-1,0; 2,0; -1,0" dur="5s" repeatCount="indefinite"/>
      <text x="22" y="48">.-.</text>
      <text x="16" y="63">(   ).</text>
      <text x="14" y="78">(___(___)</text>
    </g>
    <g fill="#9ccfd8" font-size="12">
      <animateTransform attributeName="transform" type="translate" values="0,-2; 0,4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="1.8s" repeatCount="indefinite"/>
      <text x="20" y="92">,   ,   ,</text>
    </g>
    <g fill="#9ccfd8" font-size="12">
      <animateTransform attributeName="transform" type="translate" values="0,-2; 0,4" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
      <text x="28" y="92">,   ,   ,</text>
    </g>
  </g>
  <g font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#e6edf3">
    <text x="152" y="48">Light drizzle</text>
    <text x="152" y="64"><tspan fill="#7ee0a3">+10</tspan><tspan fill="#e5c07b">(8)</tspan><tspan> °C</tspan></text>
    <text x="152" y="79">14 km/h</text>
    <text x="152" y="93">2 km &#183; 0.2 mm</text>
  </g>
</svg>
