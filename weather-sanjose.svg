<svg xmlns="http://www.w3.org/2000/svg" width="360" height="108" viewBox="0 0 360 108" role="img" aria-label="San Jose, Costa Rica: light rain, plus 19 degrees Celsius">
  <rect width="360" height="108" fill="#000000"/>
  <text x="16" y="21" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="1.5" fill="#8b949e">san jose costa rica</text>
  <g font-family="'Courier New',Courier,monospace" font-size="13" fill="#e6edf3">
    <g>
      <animateTransform attributeName="transform" type="translate" values="1,0; -2,0; 1,0" dur="5s" repeatCount="indefinite"/>
      <text x="22" y="48">.-.</text>
      <text x="16" y="63">(   ).</text>
      <text x="14" y="78">(___(___)</text>
    </g>
    <g fill="#9ccfd8" font-size="12">
      <animateTransform attributeName="transform" type="translate" values="0,-3; -1,5" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/>
      <text x="18" y="92">,  ,  ,  ,  ,</text>
    </g>
    <g fill="#9ccfd8" font-size="12">
      <animateTransform attributeName="transform" type="translate" values="0,-3; -1,5" dur="1.1s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="1.1s" begin="-0.4s" repeatCount="indefinite"/>
      <text x="24" y="92">,  ,  ,  ,</text>
    </g>
    <g fill="#9ccfd8" font-size="12">
      <animateTransform attributeName="transform" type="translate" values="0,-3; -1,5" dur="1.1s" begin="-0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="1.1s" begin="-0.75s" repeatCount="indefinite"/>
      <text x="20" y="98">,  ,  ,  ,  ,</text>
    </g>
  </g>
  <g font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#e6edf3">
    <text x="152" y="48">Light rain</text>
    <text x="152" y="64"><tspan fill="#e5c07b">+19</tspan><tspan fill="#e5c07b">(22)</tspan><tspan> °C</tspan></text>
    <text x="152" y="79">4 km/h</text>
    <text x="152" y="93">9 km &#183; 1.3 mm</text>
  </g>
</svg>
